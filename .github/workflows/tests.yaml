name: Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated top-level test names to run (empty = full suite)"
        required: false
        default: ""
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
      TEST_TIMEOUT_SCALE: "3"
    defaults:
      run:
        # thrift/thrift-gen/compile_test.go walks up looking for a dir named
        # "tchannel-go", so the checkout path must not follow the fork's name.
        working-directory: ${{ env.GOPATH }}/src/github.com/temporalio/tchannel-go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.17.x", "1.21.x"]
        include:
        # Go 1.21 test binaries abort on modern macOS (dyld: missing LC_UUID).
        - os: macos-latest
          go: "1.23.x"

    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: false

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: ${{ env.GOPATH }}/src/github.com/temporalio/tchannel-go

    - name: Load cache
      uses: actions/cache@v4
      with:
        path: ~/.glide/cache
        key: ${{ runner.os }}-go-${{ hashFiles('**/glide.lock') }}
        restore-keys: |
          ${{ runner.os }}-go-

    # No thrift-osx binary is committed under scripts/bin, so build the thrift
    # 0.16.0 compiler the way scripts/install-thrift.sh compile_osx does, in
    # $RUNNER_TEMP (make test runs clean, which wipes ./build), and drop it at
    # .bin/thrift where the Makefile's $(BIN)/thrift target expects it.
    - name: Build thrift compiler (macOS)
      if: runner.os == 'macOS'
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      run: |
        set -euo pipefail
        brew install bison flex
        export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
        THRIFT_VERSION="$(sed -n 's/^THRIFT_VERSION="\(.*\)"$/\1/p' scripts/install-thrift.sh)"
        THRIFT_SHA256="$(sed -n 's/^THRIFT_SHA256="\(.*\)"$/\1/p' scripts/install-thrift.sh)"
        test -n "$THRIFT_VERSION" && test -n "$THRIFT_SHA256"
        THRIFT_WORK="$RUNNER_TEMP/thrift"
        THRIFT_TAR="$THRIFT_WORK/thrift-${THRIFT_VERSION}.tar.gz"
        mkdir -p "$THRIFT_WORK/src" "$THRIFT_WORK/build"
        curl -fsSL "https://archive.apache.org/dist/thrift/${THRIFT_VERSION}/thrift-${THRIFT_VERSION}.tar.gz" -o "$THRIFT_TAR"
        echo "${THRIFT_SHA256}  ${THRIFT_TAR}" | shasum -U -a 256 -c
        tar -xf "$THRIFT_TAR" --strip-components=1 -C "$THRIFT_WORK/src"
        THRIFT_SRC="$THRIFT_WORK/src" THRIFT_BUILD="$THRIFT_WORK/build" scripts/build-thrift.sh
        mkdir -p .bin
        cp -f "$THRIFT_WORK/build/bin/Release/thrift" .bin/thrift
        .bin/thrift --version

    - name: Install CI
      run: make install_ci

    - name: Test CI
      run: |
        set -eo pipefail
        TEST_LOG="$RUNNER_TEMP/test.log"
        if [ -n "${{ inputs.test-filter }}" ]; then
          make clean setup
          PATH="$PWD/.bin:$PATH" go test -parallel=4 -race -v -timeout 5m -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./... 2>&1 | tee "$TEST_LOG"
          for t in ${{ inputs.test-filter }}; do
            grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$TEST_LOG" || { echo "Selected test ${t} did not run"; exit 1; }
          done
        else
          make test_ci 2>&1 | tee "$TEST_LOG"
        fi
        awk '/^--- PASS/{p++} /^--- FAIL/{f++} /^--- SKIP/{s++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$TEST_LOG"

    - name: Crossdock CI
      run: make crossdock_logs_ci

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.x"
        cache: false

    # The helper module lives in $RUNNER_TEMP, outside the checkout, so none of
    # its files end up in the module zip.
    - name: Create module zip
      run: |
        set -euo pipefail
        MODULE="github.com/temporalio/tchannel-go"
        VERSION="v1.22.1-0.20240528171429-1db37fdea938"
        HELPER_DIR="$RUNNER_TEMP/create-mod"
        OUT_DIR="$RUNNER_TEMP/module-zip"
        ZIP="$OUT_DIR/${VERSION}.zip"
        mkdir -p "$HELPER_DIR" "$OUT_DIR"
        cat > "$HELPER_DIR/main.go" <<'EOF'
        package main

        import (
            "log"
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
        )

        func main() {
            if len(os.Args) != 5 {
                log.Fatal("usage: create-mod <module-path> <version> <source-dir> <output-zip>")
            }
            m := module.Version{Path: os.Args[1], Version: os.Args[2]}
            f, err := os.Create(os.Args[4])
            if err != nil {
                log.Fatal(err)
            }
            defer f.Close()
            if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                log.Fatal(err)
            }
            log.Printf("created module zip: %s", os.Args[4])
        }
        EOF
        cd "$HELPER_DIR"
        go mod init example.com/create-mod
        go get golang.org/x/mod@v0.24.0
        go run . "$MODULE" "$VERSION" "$GITHUB_WORKSPACE" "$ZIP"
        ENTRIES="$(unzip -Z1 "$ZIP" | wc -l | tr -d ' ')"
        echo "Module zip entries: ${ENTRIES}"
        if [ "$ENTRIES" -ne 353 ]; then
          echo "Expected 353 entries in ${ZIP}, got ${ENTRIES}"
          exit 1
        fi

    - name: Upload module zip
      uses: actions/upload-artifact@v4
      with:
        name: module-zip
        path: ${{ runner.temp }}/module-zip/v1.22.1-0.20240528171429-1db37fdea938.zip
        if-no-files-found: error
